{{- if .Values.agent.enabled }}
{{- include "fleetcore.validate" . -}}
{{- $full := include "fleetcore.fullname" . -}}
{{- $secret := .Values.agent.existingSecret | default (printf "%s-agent" $full) -}}
{{- if not .Values.agent.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-agent
  labels: {{- include "fleetcore.labels" . | nindent 4 }}
type: Opaque
stringData:
  FLEET_TOKEN: {{ required "agent.enrollToken is required (mint one with POST /admin/tokens, max_uses -1 + a TTL so new nodes self-enrol)" .Values.agent.enrollToken | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $full }}-agent
  labels: {{- include "fleetcore.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fleetcore.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "fleetcore.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      {{- if .Values.agent.rbac.create }}
      serviceAccountName: {{ $full }}-agent
      {{- end }}
      # hostPID: the agent walks /proc. Without the host's PID namespace it
      # sees only itself and reports one process for the whole node.
      hostPID: {{ .Values.agent.hostPID }}
      hostNetwork: {{ .Values.agent.hostNetwork }}
      dnsPolicy: {{ if .Values.agent.hostNetwork }}ClusterFirstWithHostNet{{ else }}ClusterFirst{{ end }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: fleet-agent
          image: {{ include "fleetcore.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              # Enrol once per node; the identity persists on the host path so
              # a pod restart keeps it rather than consuming another token use
              # and leaving a stale machine record behind.
              if [ ! -f /var/lib/fleet-agent/cert.pem ]; then
                /usr/local/bin/fleet-agent enroll \
                  --server "$FLEET_SERVER" --token "$FLEET_TOKEN" \
                  --name "${NODE_NAME:-$(hostname)}" \
                  ${FLEET_CA_FINGERPRINT:+--fingerprint "$FLEET_CA_FINGERPRINT"}
              fi
              exec /usr/local/bin/fleet-agent run \
                --server "$FLEET_SERVER" \
                --metrics-interval "$FLEET_METRICS" \
                --heartbeat "$FLEET_HEARTBEAT" \
                --top-processes "$FLEET_TOPN"
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: FLEET_SERVER
              value: {{ include "fleetcore.agentServer" . | quote }}
            - name: FLEET_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: FLEET_TOKEN}
            - name: FLEET_CA_FINGERPRINT
              value: {{ .Values.agent.caFingerprint | quote }}
            - name: FLEET_METRICS
              value: {{ .Values.agent.metricsInterval | quote }}
            - name: FLEET_HEARTBEAT
              value: {{ .Values.agent.heartbeat | quote }}
            - name: FLEET_TOPN
              value: {{ .Values.agent.topProcesses | quote }}
            {{- if .Values.agent.kubelet.url }}
            - name: FLEET_KUBELET_URL
              value: {{ .Values.agent.kubelet.url | quote }}
            {{- end }}
            {{- if .Values.agent.kubelet.useServiceAccountToken }}
            # The agent reads the projected ServiceAccount token from the
            # default path automatically; nothing to pass explicitly.
            {{- end }}
          securityContext:
            # Reading other processes' /proc entries and the kubepods cgroup
            # tree needs root. The agent spawns no shell of its own and only
            # executes signed module payloads.
            runAsUser: 0
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/fleet-agent}
            # /proc and /sys are the entire metrics source; /var/log/pods is
            # the only credential-free way to map a pod cgroup UID to a name.
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true}
            - {name: podlogs, mountPath: /var/log/pods, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          hostPath: {path: /var/lib/fleet-agent, type: DirectoryOrCreate}
        - name: proc
          hostPath: {path: /proc}
        - name: cgroup
          hostPath: {path: /sys/fs/cgroup}
        - name: podlogs
          hostPath: {path: /var/log/pods, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
