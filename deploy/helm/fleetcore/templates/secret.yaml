{{- include "fleetcore.validate" . -}}
{{- if and .Values.controlPlane.enabled (not .Values.controlPlane.existingSecret) }}
{{- $name := printf "%s-admin" (include "fleetcore.fullname" .) -}}
{{- /* Reuse the existing token on upgrade. A bare randAlphaNum would mint a
       new one every `helm upgrade`, locking the operator out of their own
       control plane and breaking Prometheus's scrape credentials. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := .Values.controlPlane.adminToken -}}
{{- if and (not $token) $existing -}}
{{- $token = index $existing.data "FLEET_ADMIN_TOKEN" | b64dec -}}
{{- end -}}
{{- if not $token }}{{ $token = randAlphaNum 48 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "fleetcore.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  FLEET_ADMIN_TOKEN: {{ $token | quote }}
{{- end }}
